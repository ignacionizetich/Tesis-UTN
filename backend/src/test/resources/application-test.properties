# Configuracion exclusiva para tests (perfil "test").
# Sobrescribe application.properties para que la suite corra sin MySQL,
# sin archivo .env y sin variables de entorno.

# Base de datos en memoria: se crea al arrancar y se destruye al terminar
spring.datasource.url=jdbc:h2:mem:arcash_test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
# Hibernate avisa que podria autodetectarlo, pero hay que declararlo igual:
# si no, aplica el MySQLDialect que fija application.properties.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Valor dummy: 64 caracteres 'A' decodifican a 48 bytes en cero.
# Keys.hmacShaKeyFor exige al menos 32 bytes, y tanto JwtUtils como
# JwtAuthenticationFilter lo decodifican en su constructor: si este valor
# no es Base64 valido, el contexto de Spring no levanta.
spring.jwt.secret=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA

spring.mail.password=dummy-test-value
app.frontend.url=http://localhost:4200
