<app-theme-toggle></app-theme-toggle>

<div class="validate-page">
  <main class="validate-page__main">
    <section class="validate-card" [class.validate-card--loading]="isLoading">
      <div class="validate-card__brand">
        <app-brand-logo></app-brand-logo>
      </div>

      @if (isLoading) {
        <div class="validate-card__loader" role="status" aria-live="polite">
          <div class="validate-spinner" aria-hidden="true"></div>
          <h2>{{ title }}</h2>
          <p>{{ message }}</p>
        </div>
      } @else {
        <div
          class="validate-card__status"
          [class.validate-card__status--ok]="isSuccess"
          [class.validate-card__status--err]="!isSuccess"
          aria-hidden="true"
        >
          @if (isSuccess) {
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
              <path d="M20 6L9 17l-5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          } @else {
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
              <path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          }
        </div>

        <header class="validate-card__header">
          <h2 id="status" role="status" aria-live="polite">{{ title }}</h2>
          <p>{{ message }}</p>
        </header>

        <div class="validate-card__actions">
          @if (isSuccess) {
            <button type="button" class="validate-btn validate-btn--primary" (click)="goToLogin()">
              Ir a ingresar
            </button>
            <button type="button" class="validate-btn validate-btn--ghost" (click)="goToHome()">
              Volver al inicio
            </button>
          } @else {
            <button type="button" class="validate-btn validate-btn--primary" (click)="goToLogin()">
              Ir a ingresar
            </button>

            @if (showResendOption()) {
              @if (!showResendForm) {
                <button type="button" class="validate-btn validate-btn--ghost" (click)="openResendForm()">
                  Solicitar nuevo enlace
                </button>
              } @else {
                <div class="validate-resend">
                  <label for="validate-resend-email">Tu email</label>
                  <input
                    id="validate-resend-email"
                    type="email"
                    [(ngModel)]="resendEmail"
                    placeholder="ejemplo@correo.com"
                    autocomplete="email"
                  />
                  <button
                    type="button"
                    class="validate-btn validate-btn--primary"
                    [disabled]="isResending"
                    (click)="resendValidationEmail()"
                  >
                    {{ isResending ? 'Reenviando...' : 'Reenviar enlace' }}
                  </button>
                </div>
              }
            }
          }
        </div>
      }
    </section>
  </main>

  <app-footer></app-footer>
</div>
