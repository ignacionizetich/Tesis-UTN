@if (currentModal === 'favorites') {
<app-favorites-list-modal
  [favorites]="favoriteContacts"
  (closed)="closeFavoritesModal()"
  (favoriteSelected)="openFavoriteDetailsModal($event)"
  (backdropClick)="onBackdropClose('favorites')"
/>
}

@if (currentModal === 'favoriteDetails' && selectedFavoriteContact) {
<app-favorite-details-modal
  [favorite]="selectedFavoriteContact"
  (closed)="closeFavoriteDetailsModal()"
  (back)="backToFavoritesList()"
  (transfer)="transferToFavorite($event)"
  (edit)="openEditFavoriteModal($event)"
  (remove)="openDeleteFavoriteModal($event)"
  (backdropClick)="onBackdropClose('favoriteDetails')"
/>
}

@if (currentModal === 'addFavorite') {
<app-add-favorite-modal
  [transferCompletedData]="transferCompletedData"
  (closed)="closeAddFavoriteModal()"
  (saved)="onAddFavoriteSaved()"
  (backdropClick)="onBackdropClose('addFavorite')"
/>
}

@if (currentModal === 'editFavorite' && selectedFavoriteContact) {
<app-edit-favorite-modal
  [favorite]="selectedFavoriteContact"
  (closed)="closeEditFavoriteModal()"
  (saved)="onEditFavoriteSaved()"
  (backdropClick)="onBackdropClose('editFavorite')"
/>
}

@if (currentModal === 'deleteFavorite' && favoriteToDelete) {
<app-delete-favorite-modal
  [favorite]="favoriteToDelete"
  (closed)="closeDeleteFavoriteModal()"
  (deleted)="onDeleteFavoriteDeleted()"
  (backdropClick)="onBackdropClose('deleteFavorite')"
/>
}
