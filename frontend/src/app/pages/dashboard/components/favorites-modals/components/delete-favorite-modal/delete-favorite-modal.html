<div class="del-fav-modal" (click)="onBackdrop($event)" role="presentation">
  <div
    class="del-fav-modal__panel"
    role="dialog"
    aria-modal="true"
    aria-labelledby="del-fav-title"
    (click)="$event.stopPropagation()">

    <button
      type="button"
      class="del-fav-modal__close"
      (click)="close()"
      [disabled]="isDeletingFavorite"
      aria-label="Cerrar">
      &times;
    </button>

    <header class="del-fav-modal__header">
      <div class="del-fav-modal__icon" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <path
            d="M3 6h18m-2 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round" />
          <path
            d="M10 11v6M14 11v6"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round" />
        </svg>
      </div>
      <div>
        <h2 id="del-fav-title">Eliminar favorito</h2>
        <p>Esta acción no se puede deshacer</p>
      </div>
    </header>

    <div class="del-fav-contact">
      <div class="del-fav-contact__avatar" aria-hidden="true">{{ contactInitials }}</div>
      <div class="del-fav-contact__body">
        <strong>{{ favorite.contactAlias }}</strong>
        <span>{{ favorite.accountOwnerName }}</span>
        @if (favorite.accountAlias) {
        <span class="del-fav-contact__meta">{{ favorite.accountAlias }}</span>
        }
      </div>
    </div>

    <p class="del-fav-hint">
      ¿Seguro que querés quitar este contacto de tus favoritos?
    </p>

    <div class="del-fav-actions">
      <button
        type="button"
        class="del-fav-btn del-fav-btn--ghost"
        (click)="close()"
        [disabled]="isDeletingFavorite">
        Cancelar
      </button>
      <button
        type="button"
        class="del-fav-btn del-fav-btn--danger"
        (click)="confirm()"
        [disabled]="isDeletingFavorite">
        {{ isDeletingFavorite ? 'Eliminando...' : 'Sí, eliminar' }}
      </button>
    </div>
  </div>
</div>
