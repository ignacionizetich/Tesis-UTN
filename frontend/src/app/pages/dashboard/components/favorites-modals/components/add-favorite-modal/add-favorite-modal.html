<div class="modal" (click)="onBackdrop($event)">
  <div class="modal-content add-favorite-modal">
    <div class="modal-header">
      <h2>Agregar a Favoritos</h2>
      <span class="close-button" (click)="closed.emit()">&times;</span>
    </div>

    <div class="add-favorite-form">
      <div class="form-group">
        <input type="text" [(ngModel)]="favoriteContactAlias" placeholder=" " required maxlength="50" [disabled]="isAddingFavorite">
        <label>Nombre para agendar *</label>
      </div>

      <div class="form-group">
        <textarea [(ngModel)]="favoriteContactDescription" placeholder=" " maxlength="200" rows="3" [disabled]="isAddingFavorite"></textarea>
        <label>Descripción (opcional)</label>
      </div>

      <div class="form-actions">
        <button class="primary" (click)="save()" [disabled]="!favoriteContactAlias.trim() || isAddingFavorite">
          @if (isAddingFavorite) {
            <div class="button-loading">
              <div class="spinner"></div>
              Guardando...
            </div>
          } @else {
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
              <path
                d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"
                stroke="currentColor" stroke-width="2" />
            </svg>
            Guardar favorito
          }
        </button>

        @if (!isAddingFavorite) {
          <button class="secondary" (click)="closed.emit()">Cancelar</button>
        }
      </div>
    </div>
  </div>
</div>
