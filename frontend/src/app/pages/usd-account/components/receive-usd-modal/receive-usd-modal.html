<div class="modal-overlay" (click)="closed.emit()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>Recibir Dinero</h2>
      <button class="close-btn" type="button" (click)="closed.emit()">&times;</button>
    </div>

    <div class="modal-body">
      <div class="receive-info">
        <h3>Datos de tu cuenta en Dólares:</h3>

        <div class="info-item">
          <span class="label">Alias:</span>
          <div class="info-value">
            <span>{{ alias }}</span>
            <button class="copy-btn" type="button" (click)="copyToClipboard(alias, 'Alias')">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                <path
                  d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"
                  stroke="currentColor"
                  stroke-width="2"
                />
              </svg>
            </button>
          </div>
        </div>

        <div class="info-item">
          <span class="label">CVU:</span>
          <div class="info-value">
            <span>{{ cvu }}</span>
            <button class="copy-btn" type="button" (click)="copyToClipboard(cvu, 'CVU')">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                <path
                  d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"
                  stroke="currentColor"
                  stroke-width="2"
                />
              </svg>
            </button>
          </div>
        </div>

        <div class="info-note">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
            <path
              d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
              stroke="var(--text-accent)"
              stroke-width="2"
            />
          </svg>
          <span>Estos datos son específicos para recibir dólares (USD)</span>
        </div>
      </div>
    </div>
  </div>
</div>
