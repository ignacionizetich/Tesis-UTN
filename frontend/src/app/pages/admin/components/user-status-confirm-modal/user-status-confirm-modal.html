@if (user) {
<div class="modal confirmation-modal" [class.show]="visible">
  <div class="modal-content">
    <h3>Confirmar Acción</h3>
    <p>
      ¿Está seguro que desea {{ user.active ? 'deshabilitar' : 'habilitar' }}
      al usuario <strong>{{ user.name }} {{ user.lastName }}</strong>?
    </p>
    <div class="confirmation-buttons">
      <button class="confirm-btn" (click)="confirmed.emit()" [disabled]="loading">
        @if (loading) {
        <div class="spinner"></div>
        } @else {
        {{ user.active ? 'Deshabilitar' : 'Habilitar' }}
        }
      </button>
      <button class="cancel-btn" (click)="cancelled.emit()" [disabled]="loading">Cancelar</button>
    </div>
  </div>
</div>
}
