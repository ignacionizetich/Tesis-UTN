@if (user) {
<div class="modal confirmation-modal" [class.show]="visible">
  <div class="modal-content">
    <h3>Confirmar acción</h3>
    <p>
      ¿Seguro que querés {{ user.active ? 'deshabilitar' : 'habilitar' }}
      a <strong>{{ user.name }} {{ user.lastName }}</strong>?
    </p>
    <div class="confirmation-buttons">
      <button
        type="button"
        class="confirm-btn"
        [class.confirm-btn--enable]="!user.active"
        (click)="confirmed.emit()"
        [disabled]="loading"
      >
        @if (loading) {
        <div class="spinner"></div>
        } @else {
        {{ user.active ? 'Deshabilitar' : 'Habilitar' }}
        }
      </button>
      <button type="button" class="cancel-btn" (click)="cancelled.emit()" [disabled]="loading">
        Cancelar
      </button>
    </div>
  </div>
</div>
}
