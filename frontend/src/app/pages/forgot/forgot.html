<app-theme-toggle></app-theme-toggle>

<div class="forgot-page">
  <main class="forgot-page__main">
    <aside class="forgot-page__aside" aria-label="Marca Arcash">
      <app-brand-logo></app-brand-logo>
      <div class="forgot-page__pitch">
        <h2>Recuperá tu acceso</h2>
        <p>
          Te enviamos un enlace seguro al email para crear una nueva contraseña.
        </p>
        <ul class="forgot-page__perks">
          <li>Proceso simple y rápido</li>
          <li>Enlace válido por tiempo limitado</li>
          <li>Tu cuenta queda protegida</li>
        </ul>

        <app-back-button
          variant="inline"
          explicitRoute="/login"
          label="Volver a ingresar"
        ></app-back-button>
      </div>
    </aside>

    <section class="forgot-page__form-wrap" aria-label="Recuperar contraseña">
      <app-forgot-password-form (emailSent)="onEmailSent()"></app-forgot-password-form>
    </section>
  </main>

  <app-footer></app-footer>
</div>
