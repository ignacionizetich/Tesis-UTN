<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ARCash - Virtual Wallet</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  
  <!-- Brand: Unna + Manrope (identidad Arcash). UI: Manrope. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&family=Unna:wght@400;700&display=swap" rel="stylesheet">

  <script>
  // Inicialización inmediata del tema para prevenir flash
  (function() {
    const savedTheme = localStorage.getItem('theme');
    const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    const theme = savedTheme || (systemPrefersDark ? 'dark' : 'light');
    
    document.documentElement.setAttribute('data-theme', theme);
    if (document.body) {
      document.body.setAttribute('data-theme', theme);
    }
    
    if (theme === 'dark') {
      document.documentElement.style.backgroundColor = '#0f1419';
      document.documentElement.style.color = '#f1f5f9';
    } else {
      document.documentElement.style.backgroundColor = '#f5f7fa';
      document.documentElement.style.color = '#0b1220';
    }
  })();

  // Fix agresivo para autocompletado
document.addEventListener('DOMContentLoaded', function() {
    // Forzar transparencia en inputs
    const inputs = document.querySelectorAll('input');
    inputs.forEach(input => {
        // Resetear estilos de autocompletado
        input.style.backgroundColor = 'transparent';
        input.style.backgroundImage = 'none';
        
        // Observar cambios en el input
        input.addEventListener('animationstart', function(e) {
            if (e.animationName === 'autofill') {
                this.style.backgroundColor = 'transparent';
                this.style.backgroundImage = 'none';
            }
        });
    });
});
</script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
