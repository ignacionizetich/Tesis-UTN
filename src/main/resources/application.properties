# ==========================================
# Configuración General de la Aplicación
# ==========================================
spring.application.name=ArCash
server.port=${PORT:8080}

# ==========================================
# Base de Datos (usando variables de entorno)
# ==========================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# Configuración de JPA/Hibernate
# ==========================================
spring.jpa.hibernate.ddl-auto=update
# La siguiente línea no es necesaria con Spring Boot 3, pero no hace daño
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ==========================================
# Configuración de Seguridad (JWT)
# ==========================================
spring.jwt.secret=${SIGNED_JWT}

# ==========================================
# Configuración de Email (¡CORREGIDO PARA RESEND!)
# ==========================================
spring.mail.host=smtp.resend.com
spring.mail.port=587
spring.mail.username=resend
spring.mail.password=${RESEND_API_KEY}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true










