<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transacción Completada</title>
</head>
<body style="margin: 0; padding: 0; background-color: #0A0A0F; font-family: 'Inter', Arial, sans-serif;">
<table border="0" cellpadding="0" cellspacing="0" width="100%">
    <tr>
        <td style="padding: 20px 0;">
            <table align="center" border="0" cellpadding="0" cellspacing="0" width="600" style="border-collapse: collapse; background-color: #1A1A2E; border-radius: 12px; border: 1px solid #00FF88;">

                <!-- Encabezado -->
                <tr>
                    <td align="center" style="padding: 30px 20px; border-bottom: 1px solid rgba(0, 255, 136, 0.3);">
                        <h1 style="margin: 0; color: #E8EAF6; font-size: 28px; font-weight: 700;">
                            <span style="color: #E8EAF6;">AR</span><span style="color: #00D4FF;">Cash</span>™
                        </h1>
                    </td>
                </tr>

                <!-- Contenido Principal -->
                <tr>
                    <td style="padding: 40px 30px;">
                        <h2 style="margin: 0 0 20px 0; color: #E8EAF6; font-size: 24px; font-weight: 600;">
                            ¡Transacción exitosa, <span th:text="${username}" style="color: #00FF88;">Usuario</span>!
                        </h2>
                        <p style="margin: 0 0 30px 0; color: #E8EAF6; font-size: 16px; line-height: 1.6;">
                            Tu transferencia se ha completado exitosamente.
                        </p>

                        <!-- Detalles de la transacción -->
                        <table border="0" cellpadding="0" cellspacing="0" width="100%" style="background-color: rgba(0, 255, 136, 0.1); border-radius: 8px; padding: 20px; margin-bottom: 20px;">
                            <tr>
                                <td>
                                    <p style="margin: 0 0 10px 0; color: #E8EAF6; font-size: 14px; opacity: 0.7;">
                                        Monto transferido:
                                    </p>
                                    <p style="margin: 0 0 20px 0; color: #00FF88; font-size: 28px; font-weight: 700;">
                                        $ <span th:text="${#numbers.formatDecimal(amount, 0, 'COMMA', 2, 'POINT')}">1000.00</span>
                                    </p>
                                    <p style="margin: 0 0 10px 0; color: #E8EAF6; font-size: 14px; opacity: 0.7;">
                                        Destinatario:
                                    </p>
                                    <p style="margin: 0 0 20px 0; color: #00D4FF; font-size: 18px; font-weight: 600;">
                                        <span th:text="${destinationAlias}">alias.destino.XY</span>
                                    </p>
                                    <p style="margin: 0 0 10px 0; color: #E8EAF6; font-size: 14px; opacity: 0.7;">
                                        Fecha:
                                    </p>
                                    <p style="margin: 0; color: #E8EAF6; font-size: 14px;">
                                        <span th:text="${transactionDate}">2025-01-17</span>
                                    </p>
                                </td>
                            </tr>
                        </table>

                        <p style="margin: 30px 0 0 0; color: #E8EAF6; font-size: 14px; line-height: 1.6;">
                            Gracias por confiar en ArCash para tus transacciones.
                        </p>
                    </td>
                </tr>

                <!-- Pie de página -->
                <tr style="background-color: #0A0A0F;">
                    <td style="padding: 20px 30px;">
                        <p style="margin: 0; color: #E8EAF6; opacity: 0.7; font-size: 12px; text-align: center;">
                            © 2025 ArCash. Todos los derechos reservados.
                        </p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
