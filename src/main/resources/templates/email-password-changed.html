<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contraseña Actualizada</title>
</head>
<body style="margin: 0; padding: 0; background-color: #0A0A0F; font-family: 'Inter', Arial, sans-serif;">
<table border="0" cellpadding="0" cellspacing="0" width="100%">
    <tr>
        <td style="padding: 20px 0;">
            <table align="center" border="0" cellpadding="0" cellspacing="0" width="600" style="border-collapse: collapse; background-color: #1A1A2E; border-radius: 12px; border: 1px solid #39FFCC;">

                <!-- Encabezado -->
                <tr>
                    <td align="center" style="padding: 30px 20px; border-bottom: 1px solid rgba(57, 255, 204, 0.3);">
                        <h1 style="margin: 0; color: #E8EAF6; font-size: 28px; font-weight: 700;">
                            <span style="color: #E8EAF6;">AR</span><span style="color: #00D4FF;">Cash</span>™
                        </h1>
                    </td>
                </tr>

                <!-- Contenido Principal -->
                <tr>
                    <td style="padding: 40px 30px;">
                        <h2 style="margin: 0 0 20px 0; color: #E8EAF6; font-size: 24px; font-weight: 600;">
                            Hola, <span th:text="${username}" style="color: #39FFCC;">Usuario</span>
                        </h2>
                        <p style="margin: 0 0 30px 0; color: #E8EAF6; font-size: 16px; line-height: 1.6;">
                            Tu contraseña ha sido actualizada exitosamente.
                        </p>

                        <!-- Información del cambio -->
                        <table border="0" cellpadding="0" cellspacing="0" width="100%" style="background-color: rgba(57, 255, 204, 0.1); border-radius: 8px; margin-bottom: 20px;">
                            <tr>
                                <td align="center" style="padding: 30px 20px;">
                                    <!-- Círculo con tick -->
                                    <table border="0" cellpadding="0" cellspacing="0">
                                        <tr>
                                            <td align="center" style="width: 100px; height: 100px; background-color: rgba(57, 255, 204, 0.2); border-radius: 50%; padding: 0;">
                                                <svg width="60" height="60" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="display: block; margin: 20px auto;">
                                                    <path d="M12 2C6.48 2 2 6.48 2 12C2 17.52 6.48 22 12 22C17.52 22 22 17.52 22 12C22 6.48 17.52 2 12 2ZM10 17L5 12L6.41 10.59L10 14.17L17.59 6.58L19 8L10 17Z" fill="#39FFCC"/>
                                                </svg>
                                            </td>
                                        </tr>
                                    </table>
                                    <!-- Texto de confirmación -->
                                    <p style="margin: 20px 0 0 0; color: #39FFCC; font-size: 20px; font-weight: 600;">
                                        Contraseña actualizada correctamente
                                    </p>
                                </td>
                            </tr>
                        </table>

                        <p style="margin: 30px 0 0 0; color: #E8EAF6; font-size: 14px; line-height: 1.6;">
                            Si no realizaste este cambio, por favor contacta inmediatamente con soporte.
                        </p>
                    </td>
                </tr>

                <!-- Pie de página -->
                <tr style="background-color: #0A0A0F;">
                    <td style="padding: 20px 30px;">
                        <p style="margin: 0; color: #E8EAF6; opacity: 0.7; font-size: 12px; text-align: center;">
                            © 2025 ArCash. Todos los derechos reservados.
                        </p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
