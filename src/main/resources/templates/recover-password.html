<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Restablecer contraseña</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/demo.css}">
    <link rel="stylesheet" th:href="@{/css/color-palet.css}">
    <link rel="stylesheet" th:href="@{/css/toast.css}">
    <style>
        body {
            background: var(--bg-primary);
            min-height: 100vh;
        }
        .container {
            background: var(--bg-secondary);
            padding: 36px 32px 32px 32px;
            border-radius: 16px;
            max-width: 400px;
            margin: 60px auto;
            box-shadow: 0 4px 24px var(--text-accent, #2a4d7a22);
            text-align: center;
        }
        .form-group { margin-bottom: 18px; text-align: left; }
        label { display: block; margin-bottom: 6px; color: var(--text-accent); font-weight: 600; }
        input[type="password"] {
            width: 100%; padding: 10px; border: 1.5px solid #b3b3b3;
            border-radius: 6px; font-size: 1rem; background: var(--bg-primary);
            color: var(--text-primary);
            transition: border 0.2s;
        }
        input[type="password"]:focus { border: 1.5px solid var(--text-accent); outline: none; }
        .btn {
            background: var(--text-accent); color: #fff; border: none; padding: 12px 0;
            width: 100%; border-radius: 6px; cursor: pointer; font-weight: bold;
            font-size: 1.1rem; opacity: 1; transition: opacity 0.2s, background 0.2s; margin-top: 8px;
        }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }
        .error { color: #d32f2f; margin-bottom: 10px; }
    </style>
</head>
<body>
<div class="container">
    <div class="brand-identity">
        <svg class="brand-mark" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
            <path d="M60 20 L100 40 V80 L60 100 L20 80 V40 Z" class="vault-shape"/>
            <circle cx="60" cy="60" r="18" class="security-core"/>
            <path d="M60 42 L60 78 M48 60 L72 60" class="access-cross"/>
        </svg>
        <div>
            <div class="theme-control">
                <button id="theme-switcher">
                    <svg width="22" height="22" viewBox="0 0 24 24">
                        <path class="sun" d="M12 6a6 6 0 1 1 0 12 6 6 0 0 1 0-12zm0-2a8 8 0 1 0 0 16 8 8 0 0 0 0-16z"/>
                        <path class="sun-ray" d="M12 2v2m0 16v2M4 12H2m20 0h-2m3-7l-2 2m-13 13l-2 2m17-15l2 2M3 19l2 2"/>
                    </svg>
                </button>
            </div>
            <span class="brand-name">AR</span><span class="brand-name-sub">Cash</span>
        </div>
    </div>
    <h2>Restablecer contraseña</h2>
    <form th:action="@{/reset-password}" method="post" id="resetForm" autocomplete="off">
        <div th:if="${error}" class="error" th:text="${error}"></div>
        <input type="hidden" name="token" th:value="${token}" />
        <div class="form-group">
            <label for="password">Nueva contraseña</label>
            <input type="password" id="password" name="password" required minlength="6" autocomplete="new-password" />
        </div>
        <div class="form-group">
            <label for="confirmPassword">Confirmar contraseña</label>
            <input type="password" id="confirmPassword" name="confirmPassword" required minlength="6" autocomplete="new-password" />
        </div>
        <button type="submit" class="btn" id="submitBtn" disabled>Cambiar</button>
    </form>
</div>
<script th:src="@{/js/toast.js}"></script>
<script th:src="@{/js/theme.js}"></script>
<script>
    // Validación y feedback visual
    const password = document.getElementById('password');
    const confirm = document.getElementById('confirmPassword');
    const submitBtn = document.getElementById('submitBtn');
    let lastToast = '';

    function validatePasswords() {
        const pass = password.value.trim();
        const conf = confirm.value.trim();

        if (!pass || !conf || pass.length < 6 || conf.length < 6) {
            submitBtn.disabled = true;
            return false;
        }

        if (pass !== conf) {
            submitBtn.disabled = true;
            return false;
        } else {
            submitBtn.disabled = false;
            return true;
        }
    }

    password.addEventListener('input', () => {
        submitBtn.disabled = true;
        lastToast = '';
        // No mostrar toast aquí
        validatePasswords();
    });

    confirm.addEventListener('input', () => {
        submitBtn.disabled = true;
        lastToast = '';
        // No mostrar toast aquí
        validatePasswords();
    });

    // Solo mostrar toast cuando coinciden y el usuario termina de escribir en confirm
    confirm.addEventListener('keyup', () => {
        if (validatePasswords() && lastToast !== 'coinciden') {
            showToast('¡Las contraseñas coinciden!', 'SUCCESS');
            lastToast = 'coinciden';
        }
    });

    document.getElementById('resetForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        if (password.value !== confirm.value) {
            showToast('Las contraseñas no coinciden.', 'FAILED');
            return false;
        }
        if (!password.value || !confirm.value) {
            showToast('Completa ambos campos.', 'FAILED');
            return false;
        }

        // Envía el formulario por fetch
        const formData = new FormData(this);
        const response = await fetch(this.action, {
            method: 'POST',
            body: formData
        });

        if (response.ok) {
            showToast('Contraseña modificada exitosamente', 'SUCCESS');
            setTimeout(() => {
                window.location.href = '/home';
            }, 2000);
        } else {
            showToast('Error al modificar la contraseña.', 'FAILED');
        }
    });
</script>
<div id="toast-container"></div>
</body>
</html>
