<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Restablecer contraseña</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; }
        .container {
            background: #fff; padding: 30px; border-radius: 8px;
            max-width: 400px; margin: 60px auto; box-shadow: 0 2px 8px #ccc;
        }
        h2 { color: #2A4D7A; }
        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; }
        input[type="password"] {
            width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;
        }
        .btn {
            background: #2A4D7A; color: #fff; border: none; padding: 10px 20px;
            border-radius: 4px; cursor: pointer; font-weight: bold;
        }
        .error { color: #d32f2f; margin-bottom: 10px; }
    </style>
</head>
<body>
<div class="container">
    <h2>Restablecer contraseña</h2>
    <form th:action="@{/reset-password}" method="post">
        <div th:if="${error}" class="error" th:text="${error}"></div>
        <input type="hidden" name="token" th:value="${token}" />
        <div class="form-group">
            <label for="password">Nueva contraseña</label>
            <input type="password" id="password" name="password" required minlength="6" />
        </div>
        <div class="form-group">
            <label for="confirmPassword">Confirmar contraseña</label>
            <input type="password" id="confirmPassword" name="confirmPassword" required minlength="6" />
        </div>
        <button type="submit" class="btn">Cambiar</button>
    </form>
</div>
<div id="successModal" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.4); z-index:1000;">
    <div style="background:#fff; padding:30px; border-radius:8px; max-width:350px; margin:120px auto; text-align:center;">
        <h3>¡Contraseña cambiada!</h3>
        <p>Redireccionando al login en <span id="countdown">5</span> segundos.</p>
    </div>
</div>
<script th:inline="javascript">
    /*<![CDATA[*/
    var message = /*[[${message}]]*/ '';
    if (message && message.includes('Contraseña actualizada correctamente')) {
        var modal = document.getElementById('successModal');
        var countdown = document.getElementById('countdown');
        modal.style.display = 'block';
        let seconds = 5;
        let interval = setInterval(function() {
            seconds--;
            countdown.textContent = seconds;
            if (seconds <= 0) {
                clearInterval(interval);
                window.location.href = '/PreLogin';
            }
        }, 1000);
    }
    /*]]>*/
</script>

<script>
    document.querySelector('form').addEventListener('submit', function(e) {
        const password = document.getElementById('password').value;
        const confirm = document.getElementById('confirmPassword').value;
        const errorDiv = document.querySelector('.error');

        if (password !== confirm) {
            e.preventDefault();
            errorDiv.textContent = 'Las contraseñas no coinciden.';
            return false;
        }
        errorDiv.textContent = '';
    });
</script>
</body>
</html>
