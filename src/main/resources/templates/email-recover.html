<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña</title>
</head>
<body style="margin: 0; padding: 0; background-color: #0A0A0F; font-family: 'Inter', Arial, sans-serif;">
<table border="0" cellpadding="0" cellspacing="0" width="100%">
    <tr>
        <td style="padding: 20px 0;">
            <table align="center" border="0" cellpadding="0" cellspacing="0" width="600" style="border-collapse: collapse; background-color: #1A1A2E; border-radius: 12px; border: 1px solid #FF006E;">

                <!-- Encabezado -->
                <tr>
                    <td align="center" style="padding: 30px 20px; border-bottom: 1px solid rgba(255, 0, 110, 0.3);">
                        <h1 style="margin: 0; color: #E8EAF6; font-size: 28px; font-weight: 700;">
                            <span style="color: #E8EAF6;">AR</span><span style="color: #00D4FF;">Cash</span>™
                        </h1>
                    </td>
                </tr>

                <!-- Contenido Principal -->
                <tr>
                    <td style="padding: 40px 30px;">
                        <h2 style="margin: 0 0 20px 0; color: #E8EAF6; font-size: 24px; font-weight: 600;">
                            Hola, <span th:text="${username}" style="color: #FF006E;">Usuario</span>
                        </h2>
                        <p style="margin: 0 0 30px 0; color: #E8EAF6; font-size: 16px; line-height: 1.6;">
                            Recibimos una solicitud para restablecer tu contraseña en ArCash.
                            <br>
                            Haz clic en el botón de abajo para continuar.
                        </p>

                        <!-- Botón de Acción -->
                        <table border="0" cellpadding="0" cellspacing="0" width="100%">
                            <tr>
                                <td align="center">
                                    <!-- AQUÍ USAMOS LA NUEVA VARIABLE 'recoverUrl' -->
                                    <a th:href="${recoverUrl}"
                                       target="_blank"
                                       style="display: inline-block; padding: 14px 28px; background: linear-gradient(135deg, #FF006E 0%, #8B5FBF 100%); color: #FFFFFF; text-decoration: none; font-weight: 700; font-size: 16px; border-radius: 8px; box-shadow: 0 4px 20px rgba(255, 0, 110, 0.4);">
                                        Restablecer contraseña
                                    </a>
                                </td>
                            </tr>
                        </table>

                        <p style="margin: 30px 0 0 0; color: #E8EAF6; font-size: 14px; line-height: 1.6;">
                            Si no solicitaste este cambio, puedes ignorar este correo de forma segura.
                        </p>
                    </td>
                </tr>

                <!-- Pie de página -->
                <tr style="background-color: #0A0A0F;">
                    <td style="padding: 20px 30px;">
                        <p style="margin: 0; color: #E8EAF6; opacity: 0.7; font-size: 12px; text-align: center;">
                            © 2025 ArCash. Todos los derechos reservados.
                        </p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
