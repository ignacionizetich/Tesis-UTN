<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Validación de Cuenta</title>
    <link rel="stylesheet" th:href="@{/css/color-palet.css}">
    <link rel="stylesheet" th:href="@{/css/validate.css}">
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #e0e7ff 0%, #f7fafc 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Manrope', 'Segoe UI', Arial, sans-serif;
        }
        .success-container {
            background: var(--bg-secondary, #fff);
            border-radius: 22px;
            box-shadow: 0 8px 32px 0 rgba(42,77,122,0.18), 0 2px 8px rgba(0,0,0,0.08);
            padding: 3.2rem 2.7rem 2.7rem 2.7rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2.2rem;
            max-width: 370px;
            transition: box-shadow 0.3s;
        }
        .icon-validate {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 0.5rem;
            box-shadow: 0 4px 24px 0 rgba(37,99,235,0.18), 0 1.5px 6px rgba(0,0,0,0.06);
            animation: pop 0.5s cubic-bezier(.68,-0.55,.27,1.55);
            position: relative;
        }
        .icon-validate.success {
            background: linear-gradient(179deg, #179740 60%, #f4f4f4 110%);
            box-shadow: 0 0 24px 0 #2563eb55, 0 4px 24px 0 #60a5fa33;
        }
        .icon-validate.error {
            background: linear-gradient(179deg, #e74c3c 60%, #ffb4a2 100%);
            box-shadow: 0 0 24px 0 #e74c3c55, 0 4px 24px 0 #ffb4a233;
        }
        .icon-validate svg {
            width: 50px;
            height: 50px;
            display: block;
            filter: drop-shadow(0 0 8px rgba(0,0,0,0.10));
        }
        .icon-validate.success svg {
            stroke: #fff;
            filter: drop-shadow(0 0 8px #60a5fa88);
        }
        .icon-validate.error svg {
            stroke: #fff;
            filter: drop-shadow(0 0 8px #e74c3c88);
        }
        @keyframes pop {
            0% { transform: scale(0.7); opacity: 0; }
            80% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); }
        }
        h2#status {
            font-size: 1.5rem;
            color: var(--text-primary, #1e293b);
            text-align: center;
            margin: 0;
            font-weight: 700;
            letter-spacing: 0.01em;
            text-shadow: 0 2px 8px #2563eb11;
            transition: color 0.3s;
        }
        .main-btn {
            padding: 0.9rem 2.5rem;
            font-size: 1.15rem;
            border: none;
            border-radius: 10px;
            background: linear-gradient(179deg, #e74c3c 60%, #ffb4a2 100%);
            color: #fff;
            cursor: pointer;
            font-family: inherit;
            font-weight: 700;
            box-shadow: 0 2px 12px rgba(42, 77, 122, 0.13);
            transition: background 0.2s, transform 0.15s;
            margin-top: 1.2rem;
            letter-spacing: 0.03em;
            outline: none;
        }
        .main-btn:hover, .main-btn:focus {
            background: linear-gradient(179deg, #179740 60%, #60fa8b 100%);
            transform: translateY(-2px) scale(1.04);
            box-shadow: 0 4px 18px #2563eb33;
        }
        .btn-success {
            background: linear-gradient(179deg, #179740 60%, #308446 100%);
        }
        .btn-error {
            background: linear-gradient(179deg, #e74c3c 60%, #ffb4a2 100%);
        }
        .btn-success:hover, .btn-success:focus {
            background: linear-gradient(179deg, #179740 60%, #60fa8b 100%);
        }
        .btn-error:hover, .btn-error:focus {
            background: linear-gradient(179deg, #e74c3c 60%, #ffb4a2 100%);
            filter: brightness(1.08);
        }
    </style>
</head>
<body>
<div class="success-container">
    <div class="icon-validate success" th:if="${success == true}">
        <!-- Tick azul -->
        <svg viewBox="0 0 48 48" fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="24" cy="24" r="22" fill="rgba(255,255,255,0.08)" stroke="none"/>
            <path d="M14 25.5L22 33L34 17" stroke="white"/>
        </svg>
    </div>
    <div class="icon-validate error" th:if="${success == false}">
        <!-- Cruz roja -->
        <svg viewBox="0 0 48 48" fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="24" cy="24" r="22" fill="rgba(255,255,255,0.08)" stroke="none"/>
            <path d="M16 16L32 32M32 16L16 32" stroke="white"/>
        </svg>
    </div>
    <h2 id="status" th:text="${message}">¡Cuenta validada correctamente!</h2>
    <a href="/home"
       class="main-btn"
       th:classappend="${success == true} ? ' btn-success' : ' btn-error'">
        Ir al menú principal
    </a>
</div>
</body>
</html>
